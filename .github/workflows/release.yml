name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Rust Toolchain
      # --------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # --------------------------------------------------
      # Fast Packaging Tools Installation
      # --------------------------------------------------
      - name: Install packaging tools (cargo-deb, cargo-generate-rpm)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      # --------------------------------------------------
      # Tests
      # --------------------------------------------------
      - name: Run tests
        run: cargo test --verbose

      # --------------------------------------------------
      # Build Release Binary
      # --------------------------------------------------
      - name: Build release binary
        run: cargo build --release

      # --------------------------------------------------
      # Debian Package (.deb)
      # --------------------------------------------------
      - name: Build Debian package
        run: cargo deb

      # --------------------------------------------------
      # RPM Package (.rpm)
      # --------------------------------------------------
      - name: Build RPM package
        run: cargo generate-rpm

      # --------------------------------------------------
      # Portable Linux Tarball (.tar.gz)
      # --------------------------------------------------
      - name: Create Linux tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_DIR="markd-v${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "/tmp/${ARCHIVE_DIR}"

          cp target/release/markd "/tmp/${ARCHIVE_DIR}/"
          cp README.md "/tmp/${ARCHIVE_DIR}/"
          cp LICENSE "/tmp/${ARCHIVE_DIR}/"

          tar -czvf \
            "${ARCHIVE_DIR}.tar.gz" \
            -C /tmp "${ARCHIVE_DIR}"

          echo "TARBALL=${ARCHIVE_DIR}.tar.gz" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # Verify Artifacts
      # --------------------------------------------------
      - name: List release artifacts
        run: |
          echo "=== Debian Package ==="
          ls -lh target/debian/*.deb

          echo ""
          echo "=== RPM Package ==="
          ls -lh target/generate-rpm/*.rpm

          echo ""
          echo "=== Portable Tarball ==="
          ls -lh "$TARBALL"

      # --------------------------------------------------
      # GitHub Release
      # --------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            ${{ env.TARBALL }}
